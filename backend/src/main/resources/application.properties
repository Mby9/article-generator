server.port=8080
spring.application.name=linkedin-article-generator

# -------------------------------------------------------
# AI Provider Selection
# Options: gemini | openrouter | openai
# Can be overridden per-request via the "provider" field in the request body.
# -------------------------------------------------------
ai.provider=gemini

# Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-preview:generateContent

# OpenRouter API configuration
# Get your key at https://openrouter.ai/keys
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1
# Any model slug from https://openrouter.ai/models
openrouter.model=openai/gpt-4o-mini
